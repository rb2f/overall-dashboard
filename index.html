<!DOCTYPE html>
<html>
<head>
  <title>Overall Dashboard</title>
  <style>
    .tab { display: inline-block; margin-right: 10px; cursor: pointer; padding: 5px 10px; background: #eee; }
    .tab.active { background: #ccc; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    iframe { width: 100%; height: 600px; border: none; }
  </style>
</head>
<body>
  <h1>Overall Dashboard</h1>
  <div id="tabs">
    <div class="tab active" data-target="sales">Overall Sales Analysis</div>
    <div class="tab" data-target="str">STr Reports Analysis</div>
    <div class="tab" data-target="master">Master Dashboard</div>
  </div>
  <div id="contents">
    <div class="tab-content active" id="sales">
      <iframe src="sales.html"></iframe>
    </div>
    <div class="tab-content" id="str">
      <iframe src="str.html"></iframe>
    </div>
    <div class="tab-content" id="master">
      <iframe src="master.html"></iframe>
    </div>
  </div>
  <script>
    // Tab switching logic
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.tab-content');
    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove('active'));
        contents.forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      };
    });
  </script>
</body>
</html>
